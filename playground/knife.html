<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f1914">
<title>Phone Knife</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* Layout: one tall screen held like a knife handle; status on top, the blade in the middle, actions at the bottom. */
  :root {
    --bg: #1f1914;
    --panel: #2a221b;
    --ink: #f6efe3;
    --muted: #b7a690;
    --steel: #d8dde3;
    --tomato: #e0533d;
    --basil: #6fae63;
    --serif: "Instrument Serif", Georgia, serif;
    --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--sans); overflow: hidden; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  main { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; padding: calc(env(safe-area-inset-top, 0px) + 18px) 18px calc(env(safe-area-inset-bottom, 0px) + 18px); }
  .top { display: grid; gap: 6px; }
  .label { font: 500 11px/1 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 0; font: italic 400 40px/1 var(--serif); }
  .status { display: inline-flex; align-items: center; gap: 8px; font: 500 12px/1 var(--mono); letter-spacing: .1em; color: var(--muted); }
  .status i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .status[data-state="live"] { color: var(--ink); }
  .status[data-state="live"] i { background: var(--basil); }
  .status[data-state="error"] i { background: var(--tomato); }

  .knife { position: relative; display: grid; place-items: center; min-height: 0; }
  .knife svg { height: 100%; max-height: 440px; width: auto; max-width: 100%; transition: transform .08s; }
  .knife.chop svg { transform: translateY(14px) rotate(-4deg); }
  .flash { position: absolute; inset: 0; background: radial-gradient(circle, rgba(224, 83, 61, .45), transparent 60%); opacity: 0; transition: opacity .25s; pointer-events: none; }
  .knife.chop .flash { opacity: 1; transition: none; }
  .tip { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; font: italic 18px/1.3 var(--serif); color: var(--muted); }

  .actions { display: grid; gap: 10px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button { font: 500 16px var(--sans); color: var(--bg); background: var(--ink); border: 0; border-radius: 14px; padding: 16px; min-height: 54px; }
  button.ghost { background: var(--panel); color: var(--ink); }
  button:disabled { opacity: .45; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .count { text-align: center; font: 500 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .err { margin: 0; color: #ffb4a6; font-size: 14px; text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header class="top">
    <span class="label">Melon Bowl · Phone knife</span>
    <h1>Hold me like a knife.</h1>
    <span class="status" id="status" data-state="idle"><i aria-hidden="true"></i><span id="statusText">NOT CONNECTED</span></span>
  </header>

  <section class="knife" id="knife" aria-label="Knife">
    <div class="flash" aria-hidden="true"></div>
    <svg viewBox="0 0 120 440" role="img" aria-label="A kitchen knife: the screen top is the blade tip">
      <defs>
        <linearGradient id="steel" x1="0" x2="1"><stop offset="0" stop-color="#9aa3ad"/><stop offset=".45" stop-color="#eef1f4"/><stop offset="1" stop-color="#b9c0c8"/></linearGradient>
        <linearGradient id="wood" x1="0" x2="1"><stop offset="0" stop-color="#5a3a22"/><stop offset=".5" stop-color="#7a5232"/><stop offset="1" stop-color="#4a2f1b"/></linearGradient>
      </defs>
      <path d="M44 250 L44 40 Q44 8 76 6 L76 250 Z" fill="url(#steel)"/>
      <path d="M44 40 Q44 8 76 6 L76 22 Q54 26 52 48 L52 250 L44 250 Z" fill="#fff" opacity=".35"/>
      <rect x="40" y="248" width="40" height="16" rx="3" fill="#c9ced4"/>
      <rect x="38" y="262" width="44" height="168" rx="14" fill="url(#wood)"/>
      <circle cx="60" cy="300" r="5" fill="#d8c4a0"/><circle cx="60" cy="350" r="5" fill="#d8c4a0"/><circle cx="60" cy="400" r="5" fill="#d8c4a0"/>
    </svg>
    <p class="tip" id="tip">Point the top of the phone at your laptop screen.</p>
  </section>

  <footer class="actions">
    <p class="err" id="err" hidden></p>
    <button id="start" type="button">Start knife</button>
    <div class="row" id="liveRow" hidden>
      <button class="ghost" id="recenter" type="button">Recenter aim</button>
      <button class="ghost" id="test" type="button">Test chop</button>
    </div>
    <div class="count" id="count" hidden>Chops <span id="chops">0</span></div>
  </footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(() => {
  'use strict';
  const SB_URL = 'https://txohigzxsieqwgycektl.supabase.co';
  const SB_KEY = 'sb_publishable_P4PAITc5FyR7ulPbnqJ2uA_4ju0fiDz';
  const $ = (id) => document.getElementById(id);
  const room = (location.hash || '').slice(1).toLowerCase();
  const setStatus = (state, text) => { $('status').dataset.state = state; $('statusText').textContent = text; };
  const showErr = (msg) => { $('err').textContent = msg; $('err').hidden = !msg; };

  if (!/^[a-z0-9]{6,16}$/.test(room)) {
    setStatus('error', 'NO ROOM CODE');
    showErr('Open this page by scanning the QR code on the kitchen screen.');
    $('start').disabled = true;
    return;
  }

  let channel = null, joined = false, laptopSeen = false, chops = 0;
  let heading = 0, pitch = 0, lastSend = 0, lastChop = 0;

  function connect() {
    const client = window.supabase.createClient(SB_URL, SB_KEY, { realtime: { params: { eventsPerSecond: 40 } } });
    channel = client.channel('knife-' + room, { config: { broadcast: { self: false, ack: false } } });
    channel.on('broadcast', { event: 'hello' }, () => {
      if (!laptopSeen) { laptopSeen = true; setStatus('live', 'CONNECTED'); $('tip').textContent = 'Chop down fast to cut. Turn and tilt to aim.'; }
    });
    channel.subscribe((s) => {
      if (s === 'SUBSCRIBED') { joined = true; setStatus(laptopSeen ? 'live' : 'idle', laptopSeen ? 'CONNECTED' : 'LOOKING FOR LAPTOP'); send('phone', {}); }
      else if (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT') { setStatus('error', 'CONNECTION LOST'); showErr('Could not reach the kitchen. Check your internet and reload this page.'); }
    });
  }
  function send(event, payload) {
    if (!joined) return;
    channel.send({ type: 'broadcast', event, payload });
  }

  // the phone's long axis (the "blade") in earth space: heading from north and tilt above the horizon
  function onOrient(e) {
    if (e.alpha == null || e.beta == null) return;
    const a = e.alpha * Math.PI / 180, b = e.beta * Math.PI / 180;
    const fx = -Math.cos(b) * Math.sin(a), fy = Math.cos(a) * Math.cos(b), fz = Math.sin(b);
    heading = Math.atan2(fx, fy);
    pitch = Math.asin(Math.max(-1, Math.min(1, fz)));
    const now = performance.now();
    if (now - lastSend > 33) { lastSend = now; send('pose', { h: +heading.toFixed(4), p: +pitch.toFixed(4) }); }
  }
  // a sharp jolt is a chop
  function onMotion(e) {
    let m;
    if (e.acceleration && e.acceleration.x != null) m = Math.hypot(e.acceleration.x, e.acceleration.y, e.acceleration.z);
    else if (e.accelerationIncludingGravity && e.accelerationIncludingGravity.x != null) m = Math.abs(Math.hypot(e.accelerationIncludingGravity.x, e.accelerationIncludingGravity.y, e.accelerationIncludingGravity.z) - 9.81);
    else return;
    if (m > 16) chop();
  }
  function chop() {
    const now = performance.now();
    if (now - lastChop < 700) return;
    lastChop = now;
    send('chop', { h: heading, p: pitch });
    chops++; $('chops').textContent = chops;
    try { navigator.vibrate && navigator.vibrate(40); } catch (e) {}
    $('knife').classList.add('chop');
    setTimeout(() => $('knife').classList.remove('chop'), 160);
  }

  $('start').addEventListener('click', async () => {
    showErr('');
    try {
      // iPhone asks for motion access once, from a tap
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        const r = await DeviceOrientationEvent.requestPermission();
        if (r !== 'granted') throw new Error('denied');
      }
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        await DeviceMotionEvent.requestPermission().catch(() => 'denied');
      }
    } catch (e) {
      showErr('Motion access was blocked. Allow it for this site in your browser settings, then reload.');
      return;
    }
    window.addEventListener('deviceorientation', onOrient);
    window.addEventListener('devicemotion', onMotion);
    setTimeout(() => { if (heading === 0 && pitch === 0) showErr('No motion data yet. This needs a phone with motion sensors.'); }, 2500);
    $('start').hidden = true;
    $('liveRow').hidden = false;
    $('count').hidden = false;
    setStatus('idle', 'CONNECTING');
    connect();
    try { navigator.wakeLock && await navigator.wakeLock.request('screen'); } catch (e) {}
  });
  $('recenter').addEventListener('click', () => { send('recenter', {}); try { navigator.vibrate && navigator.vibrate(15); } catch (e) {} });
  $('test').addEventListener('click', () => { lastChop = 0; chop(); });
})();
</script>
</body>
</html>

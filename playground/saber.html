<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07060d">
<title>Beat Slice Saber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* Layout: one tall screen held like a sword hilt; side and status on top, the glowing blade in the middle, actions at the bottom. */
  :root {
    --bg: #07060d;
    --panel: #15131f;
    --ink: #f2f0ff;
    --muted: #8f8aa8;
    --red: #ff3b5c;
    --blue: #2fa8ff;
    --glow: var(--red);
    --display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  body[data-side="r"] { --glow: var(--blue); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--display); overflow: hidden; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  main { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; padding: calc(env(safe-area-inset-top, 0px) + 18px) 18px calc(env(safe-area-inset-bottom, 0px) + 18px); }
  .top { display: grid; gap: 6px; }
  .label { font: 500 11px/1 var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 0; font: 700 38px/1 var(--display); text-transform: uppercase; color: var(--glow); text-shadow: 0 0 18px var(--glow); }
  .status { display: inline-flex; align-items: center; gap: 8px; font: 500 12px/1 var(--mono); letter-spacing: .1em; color: var(--muted); }
  .status i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .status[data-state="live"] { color: var(--ink); }
  .status[data-state="live"] i { background: #63e08a; box-shadow: 0 0 8px #63e08a; }
  .status[data-state="error"] i { background: #ff8a3d; }
  /* the saber art shrinks to whatever room is left and never covers a button */
  .saber { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; overflow: hidden; padding: 14px 0 28px; }
  .blade, .hilt { pointer-events: none; }
  .blade { width: 22px; flex: 1 1 auto; min-height: 0; max-height: 440px; border-radius: 11px; background: linear-gradient(90deg, #fff 0 30%, var(--glow) 70%); box-shadow: 0 0 22px 6px var(--glow), 0 0 60px 12px var(--glow); opacity: .9; transition: transform .06s; }
  .hilt { width: 34px; height: min(110px, 18vh); flex: none; margin-top: -4px; border-radius: 6px; background: repeating-linear-gradient(#2a2838 0 10px, #1a1824 10px 14px); border: 2px solid #3b384e; }
  .saber.hit .blade { transform: scaleX(1.5); }
  .tip { position: absolute; bottom: 0; left: 0; right: 0; text-align: center; font: 500 13px var(--mono); color: var(--muted); }
  .actions { display: grid; gap: 10px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button { font: 700 17px var(--display); text-transform: uppercase; letter-spacing: .06em; color: var(--bg); background: var(--glow); border: 0; border-radius: 14px; padding: 16px; min-height: 56px; }
  button.ghost { background: var(--panel); color: var(--ink); }
  button:disabled { opacity: .45; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .count { text-align: center; font: 500 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .err { margin: 0; color: #ffb4a6; font: 500 14px var(--mono); text-align: center; }
  .calib { cursor: pointer; position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; gap: 14px; text-align: center; background: rgba(7, 6, 13, .9); border-radius: 18px; padding: 18px; }
  .calib .stepno { font: 500 12px var(--mono); letter-spacing: .2em; color: var(--muted); }
  .calib h2 { margin: 0; font: 700 30px/1.05 var(--display); text-transform: uppercase; color: var(--glow); text-shadow: 0 0 14px var(--glow); }
  .calib p { margin: 0; max-width: 30ch; color: #c9c4e4; }
  .ring { width: 92px; height: 92px; border-radius: 50%; background: conic-gradient(var(--glow) calc(var(--p, 0) * 1%), #2a2838 0); display: grid; place-items: center; }
  .ring::after { content: ""; width: 74px; height: 74px; border-radius: 50%; background: var(--bg); }
  .pose { font: 700 64px/1 var(--display); color: var(--glow); }
  .live { font: 500 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body data-side="l">
<main>
  <header class="top">
    <span class="label">Beat Slice · <span id="sideName">Left</span> saber</span>
    <h1 id="title">Red saber</h1>
    <span class="status" id="status" data-state="idle"><i aria-hidden="true"></i><span id="statusText">NOT CONNECTED</span></span>
  </header>
  <section class="saber" id="saber" aria-label="Saber">
    <div class="blade" aria-hidden="true"></div>
    <div class="hilt" aria-hidden="true"></div>
    <p class="tip" id="tip">Hold the phone however feels like a sword hilt.</p>
    <div class="calib" id="calib" hidden>
      <span class="stepno" id="calStep">STEP 1 OF 2</span>
      <div class="pose" id="calIcon" aria-hidden="true">→</div>
      <h2 id="calTitle">Point at the screen</h2>
      <p id="calText">Hold the phone the way you will swing it, aim the saber tip at the screen and keep still.</p>
      <div class="ring" id="calRing" aria-hidden="true"></div>
      <button class="ghost" id="calNow" type="button">Capture now</button>
    </div>
  </section>
  <footer class="actions">
    <p class="err" id="err" hidden></p>
    <button id="start" type="button">Ignite saber</button>
    <div class="row" id="liveRow" hidden>
      <button class="ghost" id="recenter" type="button">Recenter</button>
      <button class="ghost" id="recal" type="button">Calibrate</button>
    </div>
    <div class="live" id="live" hidden></div>
    <div class="count" id="count" hidden>Hits <span id="hits">0</span></div>
  </footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(() => {
  'use strict';
  const SB_URL = 'https://txohigzxsieqwgycektl.supabase.co';
  const SB_KEY = 'sb_publishable_P4PAITc5FyR7ulPbnqJ2uA_4ju0fiDz';
  const $ = (id) => document.getElementById(id);
  const [room, sideRaw] = (location.hash || '').slice(1).toLowerCase().split('.');
  const side = sideRaw === 'r' ? 'r' : 'l';
  document.body.dataset.side = side;
  $('sideName').textContent = side === 'r' ? 'Right' : 'Left';
  $('title').textContent = side === 'r' ? 'Blue saber' : 'Red saber';
  const setStatus = (state, text) => { $('status').dataset.state = state; $('statusText').textContent = text; };
  const showErr = (msg) => { $('err').textContent = msg; $('err').hidden = !msg; };
  if (!/^[a-z0-9]{6,16}$/.test(room || '')) {
    setStatus('error', 'NO ROOM CODE');
    showErr('Scan a QR code on the Beat Slice screen to open this page.');
    $('start').disabled = true;
    return;
  }

  let channel = null, joined = false, seen = false, hits = 0, last = 0, started = false;

  // each saber talks on its own channel so its messages are not copied to the other phone,
  // and the link heals itself when the network blips or the phone wakes up
  let client = null, retryTimer = 0;
  function connect() {
    if (!client) client = window.supabase.createClient(SB_URL, SB_KEY, { realtime: { params: { eventsPerSecond: 30 }, heartbeatIntervalMs: 10000 } });
    if (channel) { try { client.removeChannel(channel); } catch (e) {} channel = null; }
    joined = false;
    const ch = client.channel('beat-' + room + '-' + side, { config: { broadcast: { self: false, ack: false } } });
    channel = ch;
    ch.on('broadcast', { event: 'hello' }, () => {
      if (!seen) { seen = true; $('tip').textContent = cal.done ? 'Calibrated. Swing away.' : 'Finish the two calibration steps.'; }
      setStatus('live', 'CONNECTED');
    });
    ch.on('broadcast', { event: 'hit' }, ({ payload }) => {
      if (!payload || payload.s !== side) return;
      hits++; $('hits').textContent = hits;
      try { navigator.vibrate && navigator.vibrate(payload.bad ? [20, 40, 20] : 28); } catch (e) {}
      $('saber').classList.add('hit'); setTimeout(() => $('saber').classList.remove('hit'), 90);
    });
    ch.subscribe((st) => {
      if (ch !== channel) return;
      if (st === 'SUBSCRIBED') { joined = true; showErr(''); setStatus(seen ? 'live' : 'idle', seen ? 'CONNECTED' : 'LOOKING FOR SCREEN'); send('join', {}); }
      else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT' || st === 'CLOSED') { joined = false; setStatus('error', 'RECONNECTING'); scheduleReconnect(); }
    });
  }
  function scheduleReconnect() {
    clearTimeout(retryTimer);
    retryTimer = setTimeout(() => { if (!joined && started) connect(); }, 1200);
  }
  document.addEventListener('visibilitychange', async () => {
    if (document.hidden || !started) return;
    if (!joined) connect();
    // the screen lock is released whenever the page is hidden; take it again
    try { navigator.wakeLock && await navigator.wakeLock.request('screen'); } catch (e) {}
  });
  window.addEventListener('online', () => { if (started && !joined) connect(); });
  const send = (event, payload) => { if (joined) channel.send({ type: 'broadcast', event, payload: Object.assign({ s: side }, payload) }); };

  // ---------- orientation as a quaternion (no gimbal flips, any grip) ----------
  const D2R = Math.PI / 180;
  const qmul = (a, b) => [
    a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1],
    a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0],
    a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3],
    a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2]];
  const qconj = (v) => [-v[0], -v[1], -v[2], v[3]];
  const qrot = (r, v) => { const p = qmul(qmul(r, [v[0], v[1], v[2], 0]), qconj(r)); return [p[0], p[1], p[2]]; };
  const qnorm = (v) => { const l = Math.hypot(v[0], v[1], v[2], v[3]) || 1; return [v[0] / l, v[1] / l, v[2] / l, v[3] / l]; };
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = (v) => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };
  // W3C device orientation: intrinsic Z (alpha), X' (beta), Y'' (gamma)
  function eulerQuat(a, b, g) {
    const qz = [0, 0, Math.sin(a / 2), Math.cos(a / 2)], qx = [Math.sin(b / 2), 0, 0, Math.cos(b / 2)], qy = [0, Math.sin(g / 2), 0, Math.cos(g / 2)];
    return qmul(qmul(qz, qx), qy);
  }
  function nlerp(a, b, t) {
    const s2 = a[0] * b[0] + a[1] * b[1] + a[2] * b[2] + a[3] * b[3] < 0 ? -1 : 1;
    return qnorm([a[0] + (b[0] * s2 - a[0]) * t, a[1] + (b[1] * s2 - a[1]) * t, a[2] + (b[2] * s2 - a[2]) * t, a[3] + (b[3] * s2 - a[3]) * t]);
  }
  // spin between two orientations, in the phone's own frame (rad/s)
  function spinBetween(qa, qb, dt) {
    let d = qmul(qconj(qa), qb);
    if (d[3] < 0) d = [-d[0], -d[1], -d[2], -d[3]];
    const s = Math.hypot(d[0], d[1], d[2]);
    if (s < 1e-9 || dt <= 0) return [0, 0, 0];
    const ang = 2 * Math.atan2(s, d[3]) / dt;
    return [d[0] / s * ang, d[1] / s * ang, d[2] / s * ang];
  }

  // qO: the browser's orientation (always available, shaky only when the phone points straight up)
  // q:  what the saber uses; once the gyro's axes are confirmed, it is driven by the gyro instead
  let qO = null, q = null, lastOT = 0, spinO = [0, 0, 0], spinEMA = 0, betaNow = 0, upS = null;
  const upHist = [];
  let gyroRaw = null, gyro = [0, 0, 0], lastMT = 0;
  // Browsers disagree on how gyro rates are labelled (Safari differs from the standard), so the phone
  // learns the mapping by comparing raw gyro rates with how its orientation actually turns.
  const learn = { S: [[0, 0, 0], [0, 0, 0], [0, 0, 0]], weight: 0, map: null, trust: 1 };
  try { const m = JSON.parse(localStorage.getItem('beatGyroMap') || 'null'); if (Array.isArray(m) && m.length === 3) learn.map = m; } catch (e) {}
  const mapGyro = (r) => learn.map.map(([j, sgn]) => r[j] * sgn);
  function learnGyro() {
    if (!gyroRaw || Math.abs(betaNow) > 55) return;
    const m = Math.hypot(spinO[0], spinO[1], spinO[2]);
    if (m < 0.4 || m > 8) return;
    if (learn.map) {
      // keep checking the mapping; if the gyro stops agreeing with the orientation, forget it and relearn
      if (m < 0.6) return;
      const g = mapGyro(gyroRaw), gm = Math.hypot(g[0], g[1], g[2]) || 1;
      learn.trust = learn.trust * 0.92 + 0.08 * (dot(g, spinO) / (gm * m));
      if (learn.trust < 0.35) {
        learn.map = null; learn.trust = 1; learn.weight = 0; learn.S = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];
        lastMT = 0; q = qO.slice();
        try { localStorage.removeItem('beatGyroMap'); } catch (e) {}
      }
      return;
    }
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) learn.S[i][j] += spinO[i] * gyroRaw[j];
    learn.weight += m * m;
    if (learn.weight < 60) return;
    // each phone axis takes the raw channel that tracks it most strongly, if clearly so
    const map = [], used = new Set();
    for (let i = 0; i < 3; i++) {
      const row = learn.S[i].map((v, j) => ({ j, v }));
      row.sort((a, b) => Math.abs(b.v) - Math.abs(a.v));
      if (used.has(row[0].j) || Math.abs(row[0].v) < 2.5 * Math.abs(row[1].v)) return;
      used.add(row[0].j); map.push([row[0].j, Math.sign(row[0].v)]);
    }
    learn.map = map;
    try { localStorage.setItem('beatGyroMap', JSON.stringify(map)); } catch (e) {}
  }

  // which phone axis is the blade, and the pose that means "facing the screen"
  const cal = { blade: [0, 1, 0], q0: null, F: null, U: null, R: null, done: false };
  function setReference(qRef) {
    cal.q0 = qRef.slice();
    const up = qrot(qconj(qRef), [0, 0, 1]);          // world up, seen from the phone at that moment
    cal.F = norm(cal.blade);
    const k = dot(up, cal.F);
    cal.U = norm([up[0] - cal.F[0] * k, up[1] - cal.F[1] * k, up[2] - cal.F[2] * k]);
    cal.R = cross(cal.F, cal.U);
  }
  function screenPose() {
    const rel = qmul(qconj(cal.q0), q);
    const spin = learn.map ? gyro : spinO;
    const v = qrot(rel, cal.blade), w = qrot(rel, spin);
    const toScreen = (u) => [dot(u, cal.R), dot(u, cal.U), -dot(u, cal.F)];
    return { v: toScreen(v), w: toScreen(w) };
  }
  function onOrient(e) {
    if (e.alpha == null || e.beta == null || e.gamma == null) return;
    const t = e.timeStamp || performance.now();
    const qn = eulerQuat(e.alpha * D2R, e.beta * D2R, e.gamma * D2R);
    betaNow = e.beta;
    if (qO && lastOT) {
      const dt = (t - lastOT) / 1000;
      if (dt > 0.004 && dt < 0.2) {
        spinO = spinBetween(qO, qn, dt);
      }
    }
    qO = qn; lastOT = t;
    // Stillness comes from the phone's tilt (which way is down), smoothed and compared over a quarter
    // second. Tilt stays trustworthy pointing straight up, and the smoothing soaks up sensor jitter.
    const u = qrot(qconj(qn), [0, 0, 1]);
    upS = upS ? norm([upS[0] + (u[0] - upS[0]) * 0.15, upS[1] + (u[1] - upS[1]) * 0.15, upS[2] + (u[2] - upS[2]) * 0.15]) : u;
    upHist.push([t, upS]);
    while (upHist.length > 2 && t - upHist[1][0] >= 250) upHist.shift();
    const old = upHist[0], span = (t - old[0]) / 1000;
    if (span > 0.1) spinEMA = Math.acos(Math.max(-1, Math.min(1, dot(old[1], upS)))) / span;
    learnGyro();
    if (!q || !learn.map || !lastMT) q = qO;
    else if (Math.abs(e.beta) < 65 && Math.hypot(gyro[0], gyro[1], gyro[2]) < 3) q = nlerp(q, qO, 0.03);
    if (!cal.q0) setReference(qO);
  }
  function onMotion(e) {
    const r = e.rotationRate;
    if (!r || r.alpha == null) return;
    gyroRaw = [r.alpha * D2R, r.beta * D2R, r.gamma * D2R];
    if (!learn.map || !q) return;
    gyro = mapGyro(gyroRaw);
    const t = e.timeStamp || performance.now();
    const dt = lastMT ? Math.min(0.05, Math.max(0, (t - lastMT) / 1000)) : 0;
    lastMT = t;
    const m = Math.hypot(gyro[0], gyro[1], gyro[2]), ang = m * dt;
    if (ang > 1e-6) { const s2 = Math.sin(ang / 2) / m; q = qnorm(qmul(q, [gyro[0] * s2, gyro[1] * s2, gyro[2] * s2, Math.cos(ang / 2)])); }
  }
  // 20 updates a second; the screen fills the gaps with the reported spin
  setInterval(() => {
    if (calib.active) { calibTick(); return; }
    if (!q || !cal.q0) return;
    const p = screenPose();
    send('pose', { v: p.v.map((x) => +x.toFixed(4)), w: p.w.map((x) => +x.toFixed(3)) });
    $('live').textContent = 'aim ' + p.v.map((x) => (x >= 0 ? '+' : '') + x.toFixed(2)).join(' ') + (learn.map ? ' · gyro' : ' · tilt');
  }, 50);

  // ---------- two-step calibration: tip at the screen, then tip straight up ----------
  // Uses only the phone's tilt and heading, which are reliable here, never the raw gyro.
  const calib = { active: false, step: 0, still: 0, lastT: 0, qA: null, stepT: 0 };
  function startCalib() {
    Object.assign(calib, { active: true, step: 1, still: 0, lastT: performance.now(), qA: null, stepT: performance.now() });
    showCalibStep();
    $('calib').hidden = false;
  }
  function showCalibStep() {
    $('calStep').textContent = 'STEP ' + calib.step + ' OF 2';
    $('calIcon').textContent = calib.step === 1 ? '→' : '↑';
    $('calTitle').textContent = calib.step === 1 ? 'Point at the screen' : 'Point straight up';
    $('calText').textContent = calib.step === 1 ? 'Hold the phone the way you will swing it and aim the saber tip at the screen. Keep roughly still, or tap here.' : 'Same grip. Raise the saber tip up to the ceiling. Keep roughly still, or tap here.';
    $('calRing').style.setProperty('--p', 0);
    calib.stepT = performance.now();
  }
  function calibTick() {
    const now = performance.now(), dt = Math.min(100, now - calib.lastT); calib.lastT = now;
    if (!qO) { $('calText').textContent = 'Waiting for motion data… move the phone a little.'; return; }
    // step 2 only counts once the tip has really been raised away from step 1
    if (calib.step === 2 && upS) {
      const upA = qrot(qconj(calib.qA), [0, 0, 1]);
      if (Math.abs(dot(upS, upA)) > 0.75) { calib.still = 0; $('calRing').style.setProperty('--p', 0); return; }
    }
    // roughly still fills the ring; moving drains it slowly instead of resetting it
    if (spinEMA < 0.6) calib.still += dt; else calib.still = Math.max(0, calib.still - dt * 0.5);
    $('calRing').style.setProperty('--p', Math.min(100, calib.still / 7));
    if (calib.still >= 700) capture();
    else if (now - calib.stepT > 5000) $('calText').textContent = 'Hard to hold still? Tap anywhere on this card to capture.';
  }
  function capture() {
    if (!qO || !calib.active) return;
    try { navigator.vibrate && navigator.vibrate(30); } catch (e) {}
    if (calib.step === 1) { calib.qA = qO.slice(); calib.step = 2; calib.still = 0; showCalibStep(); return; }
    // the blade is whichever phone axis now points at the sky (from tilt alone, stable even pointing up)
    const blade = norm(qrot(qconj(qO), [0, 0, 1]));
    const upAtA = qrot(qconj(calib.qA), [0, 0, 1]);
    if (Math.abs(dot(blade, upAtA)) > 0.75) {
      calib.still = 0; showCalibStep();
      $('calText').textContent = 'Raise the tip higher, all the way up to the ceiling, then hold.';
      return;
    }
    cal.blade = blade;
    setReference(calib.qA);
    q = qO.slice();
    cal.done = true;
    calib.active = false;
    $('calib').hidden = true;
    send('recenter', {});
    $('tip').textContent = 'Calibrated. Swing away. Tap Recenter if the aim drifts.';
    try { navigator.vibrate && navigator.vibrate([30, 60, 30]); } catch (e) {}
  }
  $('calNow').addEventListener('click', (e) => { e.stopPropagation(); capture(); });
  $('calib').addEventListener('click', capture);

  $('start').addEventListener('click', async () => {
    showErr('');
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        if ((await DeviceOrientationEvent.requestPermission()) !== 'granted') throw new Error('denied');
      }
      // the gyro's spin rate needs motion access too on iPhone
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        await DeviceMotionEvent.requestPermission().catch(() => 'denied');
      }
    } catch (e) {
      showErr('Motion access was blocked. Allow it for this site in your browser settings, then reload.');
      return;
    }
    window.addEventListener('deviceorientation', onOrient);
    window.addEventListener('devicemotion', onMotion);
    setTimeout(() => { if (!qO) showErr('No motion data yet. Allow motion access for this site, or this phone has no motion sensors.'); }, 3000);
    $('start').hidden = true; $('liveRow').hidden = false; $('count').hidden = false; $('live').hidden = false;
    startCalib();
    setStatus('idle', 'CONNECTING');
    started = true;
    connect();
    try { navigator.wakeLock && await navigator.wakeLock.request('screen'); } catch (e) {}
  });
  // recenter keeps the learned grip and just re-aims "forward" at the screen
  $('recenter').addEventListener('click', () => { if (!q) return; setReference(q); send('recenter', {}); try { navigator.vibrate && navigator.vibrate(15); } catch (e) {} });
  $('recal').addEventListener('click', startCalib);
})();
</script>

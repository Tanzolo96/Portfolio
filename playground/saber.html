<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07060d">
<title>Beat Slice Saber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* Layout: one tall screen held like a sword hilt; side and status on top, the glowing blade in the middle, actions at the bottom. */
  :root {
    --bg: #07060d;
    --panel: #15131f;
    --ink: #f2f0ff;
    --muted: #8f8aa8;
    --red: #ff3b5c;
    --blue: #2fa8ff;
    --glow: var(--red);
    --display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  body[data-side="r"] { --glow: var(--blue); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--display); overflow: hidden; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  main { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; padding: calc(env(safe-area-inset-top, 0px) + 18px) 18px calc(env(safe-area-inset-bottom, 0px) + 18px); }
  .top { display: grid; gap: 6px; }
  .label { font: 500 11px/1 var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 0; font: 700 38px/1 var(--display); text-transform: uppercase; color: var(--glow); text-shadow: 0 0 18px var(--glow); }
  .status { display: inline-flex; align-items: center; gap: 8px; font: 500 12px/1 var(--mono); letter-spacing: .1em; color: var(--muted); }
  .status i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .status[data-state="live"] { color: var(--ink); }
  .status[data-state="live"] i { background: #63e08a; box-shadow: 0 0 8px #63e08a; }
  .status[data-state="error"] i { background: #ff8a3d; }
  .saber { position: relative; display: grid; place-items: center; min-height: 0; }
  .blade { width: 22px; height: min(62vh, 440px); border-radius: 11px; background: linear-gradient(90deg, #fff 0 30%, var(--glow) 70%); box-shadow: 0 0 22px 6px var(--glow), 0 0 60px 12px var(--glow); opacity: .9; transition: transform .06s; }
  .hilt { width: 34px; height: 110px; margin-top: -4px; border-radius: 6px; background: repeating-linear-gradient(#2a2838 0 10px, #1a1824 10px 14px); border: 2px solid #3b384e; }
  .saber.hit .blade { transform: scaleX(1.5); }
  .tip { position: absolute; bottom: 0; left: 0; right: 0; text-align: center; font: 500 13px var(--mono); color: var(--muted); }
  .actions { display: grid; gap: 10px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button { font: 700 17px var(--display); text-transform: uppercase; letter-spacing: .06em; color: var(--bg); background: var(--glow); border: 0; border-radius: 14px; padding: 16px; min-height: 56px; }
  button.ghost { background: var(--panel); color: var(--ink); }
  button:disabled { opacity: .45; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .count { text-align: center; font: 500 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .err { margin: 0; color: #ffb4a6; font: 500 14px var(--mono); text-align: center; }
  .calib { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; gap: 14px; text-align: center; background: rgba(7, 6, 13, .9); border-radius: 18px; padding: 18px; }
  .calib .stepno { font: 500 12px var(--mono); letter-spacing: .2em; color: var(--muted); }
  .calib h2 { margin: 0; font: 700 30px/1.05 var(--display); text-transform: uppercase; color: var(--glow); text-shadow: 0 0 14px var(--glow); }
  .calib p { margin: 0; max-width: 30ch; color: #c9c4e4; }
  .ring { width: 92px; height: 92px; border-radius: 50%; background: conic-gradient(var(--glow) calc(var(--p, 0) * 1%), #2a2838 0); display: grid; place-items: center; }
  .ring::after { content: ""; width: 74px; height: 74px; border-radius: 50%; background: var(--bg); }
  .pose { font: 700 64px/1 var(--display); color: var(--glow); }
  .live { font: 500 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body data-side="l">
<main>
  <header class="top">
    <span class="label">Beat Slice · <span id="sideName">Left</span> saber</span>
    <h1 id="title">Red saber</h1>
    <span class="status" id="status" data-state="idle"><i aria-hidden="true"></i><span id="statusText">NOT CONNECTED</span></span>
  </header>
  <section class="saber" id="saber" aria-label="Saber">
    <div class="blade" aria-hidden="true"></div>
    <div class="hilt" aria-hidden="true"></div>
    <p class="tip" id="tip">Hold the phone however feels like a sword hilt.</p>
    <div class="calib" id="calib" hidden>
      <span class="stepno" id="calStep">STEP 1 OF 2</span>
      <div class="pose" id="calIcon" aria-hidden="true">→</div>
      <h2 id="calTitle">Point at the screen</h2>
      <p id="calText">Hold the phone the way you will swing it, aim the saber tip at the screen and keep still.</p>
      <div class="ring" id="calRing" aria-hidden="true"></div>
      <button class="ghost" id="calNow" type="button">Capture now</button>
    </div>
  </section>
  <footer class="actions">
    <p class="err" id="err" hidden></p>
    <button id="start" type="button">Ignite saber</button>
    <div class="row" id="liveRow" hidden>
      <button class="ghost" id="recenter" type="button">Recenter</button>
      <button class="ghost" id="recal" type="button">Calibrate</button>
    </div>
    <div class="live" id="live" hidden></div>
    <div class="count" id="count" hidden>Hits <span id="hits">0</span></div>
  </footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(() => {
  'use strict';
  const SB_URL = 'https://txohigzxsieqwgycektl.supabase.co';
  const SB_KEY = 'sb_publishable_P4PAITc5FyR7ulPbnqJ2uA_4ju0fiDz';
  const $ = (id) => document.getElementById(id);
  const [room, sideRaw] = (location.hash || '').slice(1).toLowerCase().split('.');
  const side = sideRaw === 'r' ? 'r' : 'l';
  document.body.dataset.side = side;
  $('sideName').textContent = side === 'r' ? 'Right' : 'Left';
  $('title').textContent = side === 'r' ? 'Blue saber' : 'Red saber';
  const setStatus = (state, text) => { $('status').dataset.state = state; $('statusText').textContent = text; };
  const showErr = (msg) => { $('err').textContent = msg; $('err').hidden = !msg; };
  if (!/^[a-z0-9]{6,16}$/.test(room || '')) {
    setStatus('error', 'NO ROOM CODE');
    showErr('Scan a QR code on the Beat Slice screen to open this page.');
    $('start').disabled = true;
    return;
  }

  let channel = null, joined = false, seen = false, hits = 0, last = 0;

  function connect() {
    const client = window.supabase.createClient(SB_URL, SB_KEY, { realtime: { params: { eventsPerSecond: 50 } } });
    channel = client.channel('beat-' + room, { config: { broadcast: { self: false, ack: false } } });
    channel.on('broadcast', { event: 'hello' }, () => {
      if (!seen) { seen = true; setStatus('live', 'CONNECTED'); $('tip').textContent = cal.done ? 'Calibrated. Swing away.' : 'Finish the two calibration steps.'; }
    });
    channel.on('broadcast', { event: 'hit' }, ({ payload }) => {
      if (!payload || payload.s !== side) return;
      hits++; $('hits').textContent = hits;
      try { navigator.vibrate && navigator.vibrate(payload.bad ? [20, 40, 20] : 28); } catch (e) {}
      $('saber').classList.add('hit'); setTimeout(() => $('saber').classList.remove('hit'), 90);
    });
    channel.subscribe((s) => {
      if (s === 'SUBSCRIBED') { joined = true; setStatus(seen ? 'live' : 'idle', seen ? 'CONNECTED' : 'LOOKING FOR SCREEN'); send('join', {}); }
      else if (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT') { setStatus('error', 'CONNECTION LOST'); showErr('Could not reach the game. Check your internet and reload this page.'); }
    });
  }
  const send = (event, payload) => { if (joined) channel.send({ type: 'broadcast', event, payload: Object.assign({ s: side }, payload) }); };

  // ---------- orientation as a quaternion (no gimbal flips, any grip) ----------
  const D2R = Math.PI / 180;
  const qmul = (a, b) => [
    a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1],
    a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0],
    a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3],
    a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2]];
  const qconj = (v) => [-v[0], -v[1], -v[2], v[3]];
  const qrot = (r, v) => { const p = qmul(qmul(r, [v[0], v[1], v[2], 0]), qconj(r)); return [p[0], p[1], p[2]]; };
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = (v) => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };
  // W3C device orientation: intrinsic Z (alpha), X' (beta), Y'' (gamma)
  function eulerQuat(a, b, g) {
    const qz = [0, 0, Math.sin(a / 2), Math.cos(a / 2)], qx = [Math.sin(b / 2), 0, 0, Math.cos(b / 2)], qy = [0, Math.sin(g / 2), 0, Math.cos(g / 2)];
    return qmul(qmul(qz, qx), qy);
  }

  let q = null, gyro = [0, 0, 0], gyroMag = 0;
  // which phone axis is the blade, and the pose that means "facing the screen"
  const cal = { blade: [0, 1, 0], q0: null, F: null, U: null, R: null, done: false };
  function setReference(qRef) {
    cal.q0 = qRef.slice();
    const up = qrot(qconj(qRef), [0, 0, 1]);          // world up, seen from the phone at that moment
    cal.F = norm(cal.blade);
    const k = dot(up, cal.F);
    cal.U = norm([up[0] - cal.F[0] * k, up[1] - cal.F[1] * k, up[2] - cal.F[2] * k]);
    cal.R = cross(cal.F, cal.U);
  }
  // blade direction and spin in screen space (x right, y up, z toward the player)
  function screenPose() {
    const rel = qmul(qconj(cal.q0), q);
    const v = qrot(rel, cal.blade), w = qrot(rel, gyro);
    const toScreen = (u) => [dot(u, cal.R), dot(u, cal.U), -dot(u, cal.F)];
    return { v: toScreen(v), w: toScreen(w) };
  }
  function onOrient(e) {
    if (e.alpha == null || e.beta == null || e.gamma == null) return;
    q = eulerQuat(e.alpha * D2R, e.beta * D2R, e.gamma * D2R);
    if (!cal.q0) setReference(q);
    if (calib.active) { calibTick(); return; }
    const now = performance.now();
    if (now - last > 22) {
      last = now;
      const p = screenPose();
      send('pose', { v: p.v.map((x) => +x.toFixed(4)), w: p.w.map((x) => +x.toFixed(3)) });
      $('live').textContent = 'aim ' + p.v.map((x) => (x >= 0 ? '+' : '') + x.toFixed(2)).join(' ');
    }
  }
  function onMotion(e) {
    const r = e.rotationRate;
    if (!r || r.alpha == null) return;
    // degrees per second about the phone's own z (alpha), x (beta) and y (gamma)
    gyro = [r.beta * D2R, r.gamma * D2R, r.alpha * D2R];
    gyroMag = Math.hypot(gyro[0], gyro[1], gyro[2]);
  }

  // ---------- two-step calibration: tip at the screen, then tip straight up ----------
  const calib = { active: false, step: 0, still: 0, lastT: 0, qA: null };
  function startCalib() {
    Object.assign(calib, { active: true, step: 1, still: 0, lastT: performance.now(), qA: null });
    showCalibStep();
    $('calib').hidden = false;
  }
  function showCalibStep() {
    $('calStep').textContent = 'STEP ' + calib.step + ' OF 2';
    $('calIcon').textContent = calib.step === 1 ? '→' : '↑';
    $('calTitle').textContent = calib.step === 1 ? 'Point at the screen' : 'Point straight up';
    $('calText').textContent = calib.step === 1 ? 'Hold the phone the way you will swing it, aim the saber tip at the screen and keep still.' : 'Same grip. Raise the saber tip straight up at the ceiling and keep still.';
    $('calRing').style.setProperty('--p', 0);
  }
  function calibTick() {
    const now = performance.now(), dt = Math.min(100, now - calib.lastT); calib.lastT = now;
    // hold still for 0.8 s to capture
    calib.still = gyroMag < 0.35 ? calib.still + dt : 0;
    $('calRing').style.setProperty('--p', Math.min(100, calib.still / 8));
    if (calib.still >= 800) capture();
  }
  function capture() {
    if (!q) return;
    try { navigator.vibrate && navigator.vibrate(30); } catch (e) {}
    if (calib.step === 1) { calib.qA = q.slice(); calib.step = 2; calib.still = 0; showCalibStep(); return; }
    // the blade is whichever phone axis now points at the sky
    const blade = norm(qrot(qconj(q), [0, 0, 1]));
    const upAtA = qrot(qconj(calib.qA), [0, 0, 1]);
    if (Math.abs(dot(blade, upAtA)) > 0.6) {
      calib.step = 1; calib.still = 0; showCalibStep();
      $('calText').textContent = 'That looked the same as step 1. Point at the screen again, then raise the tip all the way up.';
      return;
    }
    cal.blade = blade;
    setReference(calib.qA);
    cal.done = true;
    calib.active = false;
    $('calib').hidden = true;
    send('recenter', {});
    $('tip').textContent = 'Calibrated. Swing away. Tap Recenter if the aim drifts.';
    try { navigator.vibrate && navigator.vibrate([30, 60, 30]); } catch (e) {}
  }
  $('calNow').addEventListener('click', capture);

  $('start').addEventListener('click', async () => {
    showErr('');
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        if ((await DeviceOrientationEvent.requestPermission()) !== 'granted') throw new Error('denied');
      }
      // the gyro's spin rate needs motion access too on iPhone
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        await DeviceMotionEvent.requestPermission().catch(() => 'denied');
      }
    } catch (e) {
      showErr('Motion access was blocked. Allow it for this site in your browser settings, then reload.');
      return;
    }
    window.addEventListener('deviceorientation', onOrient);
    window.addEventListener('devicemotion', onMotion);
    setTimeout(() => { if (!q) showErr('No motion data yet. This needs a phone with motion sensors.'); }, 2500);
    $('start').hidden = true; $('liveRow').hidden = false; $('count').hidden = false; $('live').hidden = false;
    startCalib();
    setStatus('idle', 'CONNECTING');
    connect();
    try { navigator.wakeLock && await navigator.wakeLock.request('screen'); } catch (e) {}
  });
  // recenter keeps the learned grip and just re-aims "forward" at the screen
  $('recenter').addEventListener('click', () => { if (!q) return; setReference(q); send('recenter', {}); try { navigator.vibrate && navigator.vibrate(15); } catch (e) {} });
  $('recal').addEventListener('click', startCalib);
})();
</script>
</body>
</html>
